name: CodeQL

# Semantic static analysis (data-flow / taint tracking): the tier above scripts/check-policy.mjs.
# Sources: WebSocket messages, HTTP request URLs. Sinks: DOM writes, file paths, eval-like calls.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, catches new query packs against unchanged code

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (javascript-typescript)
    if: vars.RUN_CI != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # required to upload results to the Security tab
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
