<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base Code Arena</title>
    <link rel="stylesheet" href="/src/client/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div id="crosshair"></div>
      <div id="hp"><span id="hp-value">100</span> HP</div>
      <div id="feed"></div>
      <div id="scoreboard" hidden></div>
      <div id="dead" hidden>You were eliminated. Respawning...</div>
      <div id="notice" hidden></div>
    </div>

    <form id="menu">
      <h1>Base Code Arena</h1>
      <label for="name">Callsign</label>
      <input id="name" name="name" maxlength="16" autocomplete="off" placeholder="Player" />
      <button type="submit">Play</button>
      <p class="hint">WASD move · Space jump · Mouse aim · Click shoot · Tab scoreboard · Esc release mouse</p>
    </form>

    <script type="module" src="/src/client/main.js"></script>
  </body>
</html>
